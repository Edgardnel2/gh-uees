<!doctype html>
<html lang="es-SV"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub · Ai Labs</title><style>
      @layer reset, tokens, base, layout;

      @layer reset {
        *, *::before, *::after { box-sizing: border-box; }
        body, h1, h2, p, figure { margin: 0; }
      }

      @layer tokens {
        :root {
          color-scheme: light dark;
          --background: #f5f3f8;
          --ink: #18151d;
          --muted: #696270;
          --accent: #5438f5;
          --line: #ddd9e4;
          --white: #fff;
          --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
          --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
          --space-xs: .5rem;
          --space-sm: 1rem;
          --space-md: 1.5rem;
          --space-lg: 2rem;
          --space-xl: 3rem;
          --space-2xl: 4rem;
          --space-3xl: 6rem;
          --page-width: 73rem;
          --qr-width: 22rem;
          --radius: 1.25rem;
          --text-small: .8125rem;
          --text-body: 1rem;
          --text-email: clamp(1rem, 2vw, 1.25rem);
          --text-heading: clamp(3.5rem, 7vw, 6rem);
          --text-brand: 1.75rem;
          --weight-normal: 400;
          --weight-medium: 500;
          --weight-bold: 700;
          --tracking-tight: -.065em;
          --tracking-label: .14em;
          --outline: 3px;
          --outline-offset: 6px;
          --surface: #ece9f2;
          --on-accent: #faf9ff;
          --tracking-brand: -.045em;
          --press-offset: 1px;
          --nav-radius: .75rem;
          --people-width: 48rem;
          --people-heading: clamp(2.5rem, 6vw, 4rem);
          --text-section: 1.75rem;
          --qr-mobile: 18rem;
        }
      }

      @layer base {
        body {
          background: var(--background);
          color: var(--ink);
          font-family: var(--sans);
          -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: var(--space-xs); }
        a:hover { color: var(--accent); }
        a:focus-visible { outline: var(--outline) solid var(--accent); outline-offset: var(--outline-offset); }
        ::selection { background: var(--accent); color: var(--white); }
      }

      @layer layout {
        .page {
          width: min(100%, var(--page-width));
          min-height: 100svh;
          min-height: 100dvh;
          margin-inline: auto;
          padding: var(--space-lg) var(--space-md);
          display: grid;
          grid-template-rows: auto 1fr auto;
        }
        .header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--line); }
        .brand {
          display: inline-block;
          font-size: var(--text-brand);
          font-weight: var(--weight-bold);
          letter-spacing: var(--tracking-brand);
          text-decoration: none;
        }
        .brand span { color: var(--accent); }
        .content {
          display: grid;
          align-items: center;
          gap: var(--space-lg);
          padding-block: var(--space-lg);
        }
        .identity { min-width: 0; }
        .eyebrow {
          margin-bottom: var(--space-md);
          color: var(--muted);
          font-family: var(--mono);
          font-size: var(--text-small);
          font-weight: var(--weight-normal);
          letter-spacing: var(--tracking-label);
          text-transform: uppercase;
        }
        h1 {
          font-size: var(--text-heading);
          line-height: .98;
          letter-spacing: var(--tracking-tight);
          font-weight: var(--weight-medium);
        }
        h1 span { display: block; }
        .email {
          display: inline-block;
          margin-top: var(--space-lg);
          font-size: var(--text-email);
          line-height: 1.6;
          overflow-wrap: anywhere;
        }
        .qr { width: min(100%, var(--qr-width)); justify-self: center; }
        .qr-image {
          display: block;
          background: var(--white);
          border: 1px solid var(--line);
          border-radius: var(--radius);
          padding: var(--space-sm);
          aspect-ratio: 1;
        }
        .qr-image img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
        figcaption { padding-top: var(--space-md); text-align: center; }
        h2 { font-size: var(--text-body); font-weight: var(--weight-medium); line-height: 1.5; }
        .destination {
          display: inline-block;
          margin-top: var(--space-xs);
          color: var(--muted);
          font-family: var(--mono);
          font-size: var(--text-small);
          line-height: 1.6;
        }
        .footer {
          display: flex;
          justify-content: space-between;
          gap: var(--space-sm);
          padding-top: var(--space-md);
          border-top: 1px solid var(--line);
          color: var(--muted);
          font-size: var(--text-small);
          line-height: 1.5;
        }
        .footer span:last-child { color: var(--accent); }
        @media (min-width: 768px) {
          .page { padding: var(--space-xl) var(--space-xl) var(--space-lg); }
          .content { grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: var(--space-2xl); }
          .qr { justify-self: end; }
        }
        @media (max-width: 767px) {
          .identity { text-align: center; }
          .qr { max-width: var(--qr-mobile); }
        }
        @media print {
          :root { --background: #fff; }
          .page { min-height: 0; }
          .content { grid-template-columns: 1fr 1fr; }
          .identity { text-align: left; }
          .qr { break-inside: avoid; }
          a { text-decoration: none; }
        }
      }
    

      @layer tokens {
        @media (prefers-color-scheme: dark) {
          :root {
            --background: #17151c;
            --ink: #f3f0f8;
            --muted: #b8b1c5;
            --accent: #b1a1ff;
            --line: #39323f;
            --surface: #24202c;
          }
        }
      }
      @layer layout {
        nav { display: flex; align-items: center; gap: var(--space-xs); white-space: nowrap; }
        nav a { padding: var(--space-xs) var(--space-sm); border-radius: var(--nav-radius); text-decoration: none; font-size: var(--text-small); font-weight: var(--weight-medium); }
        nav a:hover, nav a[aria-current="page"] { background: var(--surface); color: var(--accent); }
        a:active { transform: translateY(var(--press-offset)); }
        .people { padding-block: var(--space-xl); max-width: var(--people-width); width: 100%; overflow-wrap: anywhere; }
        .people h1 { font-size: var(--people-heading); margin-bottom: var(--space-lg); }
        .people h2, .people h3 { font-size: var(--text-section); letter-spacing: var(--tracking-brand); margin: var(--space-xl) 0 var(--space-sm); }
        .people p, .people ul { line-height: 1.7; margin-bottom: var(--space-sm); max-width: 65ch; }
        .people ul { padding-left: var(--space-md); }
        .people pre { overflow: auto; padding: var(--space-sm); background: var(--surface); border-radius: var(--nav-radius); }
        .people a { color: var(--accent); }
        .people[aria-busy="true"] { color: var(--muted); }
        @media (max-width: 767px) {
          .page { padding-inline: var(--space-sm); }
          .footer { flex-wrap: wrap; }
        }
      }
</style><script src="/script.js" defer></script></head>
<body><div class="page"><header class="header"><a class="brand" href="/" aria-label="Inicio"><span>Ai</span> /abs</a><nav aria-label="Principal"><a href="/">Inicio</a><a href="/github" aria-current="page">GitHub</a></nav></header>
<main class="people" id="people" aria-live="polite" aria-busy="true"><p>Cargando personas…</p></main><noscript>Activá JavaScript para cargar el contenido de people.md.</noscript>
<footer class="footer"><span>Walter Morales</span><a href="mailto:hello@wmorales.dev">hello@wmorales.dev</a></footer></div></body></html>
